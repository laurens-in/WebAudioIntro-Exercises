<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>fm-example</title>
</head>

<body>
  <div id="app">
    <input type="range" min="1" max="500" step="0.1" id="mod-frequency">mod frequency</input>
    <input type="range" min="0" max="200" step="0.1" id="mod-depth">mod depth</input>
    <input type="range" min="200" max="1000" step="0.1" id="carrier-frequency">carrier frequency</input>
    <input type="range" min="0" max="1" step="0.001" id="outgain">output gain</input>
    <button id="randomize">Anything</button>
    <button id="noise">Noise</button>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
